name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'build-source/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'build-source/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('source.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "source.zip SHA256=$hash"
          if ($hash -ne '36a8ef556e1ec45c732c46f138ef378c46efa59e4e3308a6b5891a64b40eecc5') {
            throw "Source package SHA256 mismatch."
          }
          New-Item -ItemType Directory -Force -Path src | Out-Null
          Expand-Archive 'source.zip' -DestinationPath src -Force

      - name: Apply build fixes
        shell: pwsh
        run: |
          $ssh = Get-Content 'src/Services/SshHostService.cs' -Raw
          $ssh = $ssh.Replace('int status = command.ExitStatus;', 'int status = command.ExitStatus ?? -1;')
          Set-Content 'src/Services/SshHostService.cs' $ssh -Encoding UTF8
          $store = Get-Content 'src/Services/HostStore.cs' -Raw
          if (-not $store.StartsWith('using System.IO;')) {
            $store = "using System.IO;`r`n" + $store
          }
          Set-Content 'src/Services/HostStore.cs' $store -Encoding UTF8

          # .NET 10 already provides ProtectedData on Windows; remove the redundant
          # package reference to keep restore/build warning-free.
          $project = Get-Content 'src/LinuxBackupManager.csproj' -Raw
          $project = [regex]::Replace(
            $project,
            '(?m)^\s*<PackageReference\s+Include="System\.Security\.Cryptography\.ProtectedData"[^>]*/>\s*\r?\n?',
            ''
          )
          Set-Content 'src/LinuxBackupManager.csproj' $project -Encoding UTF8

      - name: Add real backup history module
        shell: pwsh
        run: |
          @'
          using System;
          using System.Linq;

          namespace LinuxBackupManager.Models;

          public sealed class HistoryEntry
          {
              public DateTimeOffset? Start { get; init; }
              public DateTimeOffset? End { get; init; }
              public string StartText { get; init; } = "";
              public string EndText { get; init; } = "";
              public string Status { get; init; } = "";
              public long Bytes { get; init; }
              public string SizeText { get; init; } = "";
              public string DurationText { get; init; } = "";
              public string RunId { get; init; } = "";
              public string Detail { get; init; } = "";

              public static HistoryEntry FromTsv(string line)
              {
                  string[] p = line.Split('\t');
                  string startRaw = p.Length > 0 ? p[0].Trim() : "";
                  string endRaw = p.Length > 1 ? p[1].Trim() : "";
                  string status = p.Length > 2 ? p[2].Trim() : "";
                  long.TryParse(p.Length > 3 ? p[3].Trim() : "0", out long bytes);
                  string detail = p.Length > 4 ? string.Join("\t", p.Skip(4)).Trim() : "";
                  DateTimeOffset? start = DateTimeOffset.TryParse(startRaw, out var s) ? s : null;
                  DateTimeOffset? end = DateTimeOffset.TryParse(endRaw, out var e) ? e : null;
                  string runId = "";
                  foreach (string token in detail.Split(' ', StringSplitOptions.RemoveEmptyEntries))
                      if (token.StartsWith("run_id=", StringComparison.OrdinalIgnoreCase)) { runId = token[7..]; break; }

                  string duration = "";
                  if (start.HasValue && end.HasValue)
                  {
                      TimeSpan d = end.Value - start.Value;
                      duration = d.TotalHours >= 1 ? $"{(int)d.TotalHours:00}:{d.Minutes:00}:{d.Seconds:00}" : $"{d.Minutes:00}:{d.Seconds:00}";
                  }

                  return new HistoryEntry
                  {
                      Start = start,
                      End = end,
                      StartText = start?.ToLocalTime().ToString("yyyy-MM-dd HH:mm:ss") ?? startRaw,
                      EndText = end?.ToLocalTime().ToString("yyyy-MM-dd HH:mm:ss") ?? endRaw,
                      Status = status,
                      Bytes = bytes,
                      SizeText = FormatBytes(bytes),
                      DurationText = duration,
                      RunId = runId,
                      Detail = detail
                  };
              }

              private static string FormatBytes(long bytes)
              {
                  if (bytes <= 0) return bytes == 0 ? "0 B" : "";
                  string[] units = { "B", "KiB", "MiB", "GiB", "TiB", "PiB" };
                  double n = bytes;
                  int i = 0;
                  while (n >= 1024 && i < units.Length - 1) { n /= 1024; i++; }
                  return $"{n:0.##} {units[i]}";
              }
          }
          '@ | Set-Content 'src/Models/HistoryEntry.cs' -Encoding UTF8

          @'
          <Window x:Class="LinuxBackupManager.HistoryWindow"
                  xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                  xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                  Title="LINUX BACKUP MANAGER - Real Backup History"
                  Width="1180" Height="680" MinWidth="900" MinHeight="520"
                  WindowStartupLocation="CenterOwner" Icon="Assets/LinuxBackupManager.ico">
              <Grid Margin="16">
                  <Grid.RowDefinitions>
                      <RowDefinition Height="Auto"/>
                      <RowDefinition Height="Auto"/>
                      <RowDefinition Height="*"/>
                      <RowDefinition Height="Auto"/>
                  </Grid.RowDefinitions>

                  <Border Style="{StaticResource CardBorder}" Margin="0,0,0,8">
                      <Grid>
                          <Grid.ColumnDefinitions><ColumnDefinition Width="*"/><ColumnDefinition Width="Auto"/></Grid.ColumnDefinitions>
                          <StackPanel>
                              <TextBlock Text="REAL BACKUP HISTORY" FontSize="23" FontWeight="Bold" Foreground="#111111"/>
                              <TextBlock x:Name="ContextText" Margin="0,4,0,0" Foreground="#444444"/>
                              <TextBlock Text="Live source: /var/lib/linux-backup-manager/history/&lt;profile&gt;.tsv on the selected Linux host"
                                         Margin="0,3,0,0" Foreground="#666666" FontSize="12"/>
                          </StackPanel>
                          <StackPanel Grid.Column="1" Orientation="Horizontal" VerticalAlignment="Center">
                              <Button Style="{StaticResource SecondaryButton}" Content="Refresh from Host" Click="Refresh_Click"/>
                              <Button Style="{StaticResource SecondaryButton}" Content="Export CSV" Click="ExportCsv_Click"/>
                              <Button Style="{StaticResource PrimaryButton}" Content="Close" Click="Close_Click"/>
                          </StackPanel>
                      </Grid>
                  </Border>

                  <Grid Grid.Row="1" Margin="6,2,6,8">
                      <Grid.ColumnDefinitions><ColumnDefinition Width="Auto"/><ColumnDefinition Width="140"/><ColumnDefinition Width="Auto"/><ColumnDefinition Width="140"/><ColumnDefinition Width="*"/></Grid.ColumnDefinitions>
                      <TextBlock Text="Runs" FontWeight="SemiBold" VerticalAlignment="Center"/>
                      <TextBlock x:Name="RunCountText" Grid.Column="1" Margin="8,0,24,0" VerticalAlignment="Center"/>
                      <TextBlock Grid.Column="2" Text="Last result" FontWeight="SemiBold" VerticalAlignment="Center"/>
                      <TextBlock x:Name="LastResultText" Grid.Column="3" Margin="8,0,24,0" VerticalAlignment="Center"/>
                      <TextBlock x:Name="UpdatedText" Grid.Column="4" HorizontalAlignment="Right" Foreground="#555555" VerticalAlignment="Center"/>
                  </Grid>

                  <DataGrid Grid.Row="2" x:Name="HistoryGrid" Margin="6" AutoGenerateColumns="False" IsReadOnly="True"
                            SelectionMode="Single" AlternationCount="2" CanUserSortColumns="True" Foreground="#111111">
                      <DataGrid.Columns>
                          <DataGridTextColumn Header="Start" Binding="{Binding StartText}" Width="170"/>
                          <DataGridTextColumn Header="End" Binding="{Binding EndText}" Width="170"/>
                          <DataGridTextColumn Header="Status" Binding="{Binding Status}" Width="90"/>
                          <DataGridTextColumn Header="Duration" Binding="{Binding DurationText}" Width="90"/>
                          <DataGridTextColumn Header="Size" Binding="{Binding SizeText}" Width="110"/>
                          <DataGridTextColumn Header="Run ID" Binding="{Binding RunId}" Width="150"/>
                          <DataGridTextColumn Header="Detail" Binding="{Binding Detail}" Width="*"/>
                      </DataGrid.Columns>
                  </DataGrid>

                  <Border Grid.Row="3" Style="{StaticResource CardBorder}" Margin="0,8,0,0" Padding="10">
                      <TextBlock x:Name="StatusText" Text="Ready." Foreground="#333333" TextWrapping="Wrap"/>
                  </Border>
              </Grid>
          </Window>
          '@ | Set-Content 'src/HistoryWindow.xaml' -Encoding UTF8

          @'
          using System.Collections.ObjectModel;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Windows;
          using LinuxBackupManager.Models;
          using LinuxBackupManager.Services;
          using Microsoft.Win32;

          namespace LinuxBackupManager;

          public partial class HistoryWindow : Window
          {
              private readonly HostProfile _host;
              private readonly string _password;
              private readonly string _profile;
              private readonly RemoteLbmService _lbm;
              private readonly ObservableCollection<HistoryEntry> _entries = new();

              public HistoryWindow(HostProfile host, string password, string profile, RemoteLbmService lbm)
              {
                  InitializeComponent();
                  _host = host;
                  _password = password;
                  _profile = profile;
                  _lbm = lbm;
                  HistoryGrid.ItemsSource = _entries;
                  ContextText.Text = $"Host: {host.Name} ({host.Host})   •   Profile: {profile}";
                  Loaded += async (_, _) => await RefreshHistoryAsync();
              }

              private async Task RefreshHistoryAsync()
              {
                  StatusText.Text = "Reading real history from the selected Linux host...";
                  IsEnabled = false;
                  try
                  {
                      var r = await _lbm.HistoryDataAsync(_host, _password, _profile);
                      if (!r.Success)
                      {
                          StatusText.Text = "History read failed: " + r.Combined;
                          return;
                      }

                      _entries.Clear();
                      var lines = r.Output.Replace("\r", "").Split('\n', StringSplitOptions.RemoveEmptyEntries);
                      foreach (string line in lines.Reverse())
                      {
                          if (line.Count(ch => ch == '\t') < 4) continue;
                          _entries.Add(HistoryEntry.FromTsv(line));
                      }

                      RunCountText.Text = _entries.Count.ToString();
                      LastResultText.Text = _entries.Count == 0 ? "No runs" : _entries[0].Status;
                      UpdatedText.Text = "Refreshed: " + DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss");
                      StatusText.Text = _entries.Count == 0
                          ? "No backup runs are recorded yet for this profile."
                          : $"Loaded {_entries.Count} real backup run(s) from {_host.Host}. Newest runs are shown first.";
                  }
                  finally { IsEnabled = true; }
              }

              private async void Refresh_Click(object sender, RoutedEventArgs e) => await RefreshHistoryAsync();

              private static string Csv(string value)
          {
              const string quote = "\"";
              return quote + (value ?? "").Replace(quote, quote + quote) + quote;
          }

              private void ExportCsv_Click(object sender, RoutedEventArgs e)
              {
                  if (_entries.Count == 0) { MessageBox.Show(this, "There is no history to export."); return; }
                  var dlg = new SaveFileDialog
                  {
                      Title = "Export Real Backup History",
                      FileName = $"{_profile}-backup-history-{DateTime.Now:yyyyMMdd-HHmmss}.csv",
                      Filter = "CSV files (*.csv)|*.csv|All files (*.*)|*.*"
                  };
                  if (dlg.ShowDialog(this) != true) return;

                  var sb = new StringBuilder();
                  sb.AppendLine("Start,End,Status,Duration,Bytes,Size,RunId,Detail");
                  foreach (var entry in _entries)
                      sb.AppendLine(string.Join(",", Csv(entry.StartText), Csv(entry.EndText), Csv(entry.Status), Csv(entry.DurationText),
                          entry.Bytes, Csv(entry.SizeText), Csv(entry.RunId), Csv(entry.Detail)));
                  File.WriteAllText(dlg.FileName, sb.ToString(), new UTF8Encoding(true));
                  StatusText.Text = "Exported: " + dlg.FileName;
              }

              private void Close_Click(object sender, RoutedEventArgs e) => Close();
          }
          '@ | Set-Content 'src/HistoryWindow.xaml.cs' -Encoding UTF8

          $svc = Get-Content 'src/Services/RemoteLbmService.cs' -Raw
          if (-not $svc.Contains('HistoryDataAsync')) {
            $needle = '    public Task<RemoteCommandResult> HistoryAsync(HostProfile h, string p, string profile) => ExecAsync(h, p, "lbm history " + Q(profile), TimeSpan.FromMinutes(5), true);'
            $addition = @'
              public Task<RemoteCommandResult> HistoryDataAsync(HostProfile h, string p, string profile) => ExecAsync(h, p, "f=/var/lib/linux-backup-manager/history/" + Q(profile) + ".tsv; if [ -s \"$f\" ]; then tail -n 500 \"$f\"; fi", TimeSpan.FromMinutes(5), true);
          '@
            $svc = $svc.Replace($needle, $needle + "`r`n" + $addition.Trim())
            Set-Content 'src/Services/RemoteLbmService.cs' $svc -Encoding UTF8
          }

          $ops = Get-Content 'src/OperationsWindow.xaml.cs' -Raw
          $oldHistory = '    private void History_Click(object s, RoutedEventArgs e) => NeedProfile(p => RunAsync("History " + p, (h, pw) => _lbm.HistoryAsync(h, pw, p)));'
          $newHistory = @'
              private void History_Click(object s, RoutedEventArgs e)
              {
                  if (CurrentHost is null) { MessageBox.Show(this, "Select a host first."); return; }
                  if (string.IsNullOrWhiteSpace(SelectedProfile)) { MessageBox.Show(this, "Select a backup profile first."); return; }
                  var w = new HistoryWindow(CurrentHost, Password, SelectedProfile, _lbm) { Owner = this };
                  w.ShowDialog();
              }
          '@
          if ($ops.Contains($oldHistory)) {
            $ops = $ops.Replace($oldHistory, $newHistory.Trim())
            Set-Content 'src/OperationsWindow.xaml.cs' $ops -Encoding UTF8
          }

          $project = Get-Content 'src/LinuxBackupManager.csproj' -Raw
          $project = [regex]::Replace($project, '<Version>[^<]+</Version>', '<Version>1.0.3</Version>')
          Set-Content 'src/LinuxBackupManager.csproj' $project -Encoding UTF8

          $main = Get-Content 'src/MainWindow.xaml' -Raw
          $main = $main.Replace('v1.0.0', 'v1.0.3').Replace('v1.0.1', 'v1.0.3').Replace('v1.0.2', 'v1.0.3')
          Set-Content 'src/MainWindow.xaml' $main -Encoding UTF8

          $app = Get-Content 'src/App.xaml' -Raw
          $app = $app.Replace('<Style x:Key="TextInput" TargetType="TextBox">', '<Style x:Key="TextInput" TargetType="TextBox">')
          $app = $app.Replace('<Setter Property="Foreground" Value="White"/>', '<Setter Property="Foreground" Value="#111111"/>')
          Set-Content 'src/App.xaml' $app -Encoding UTF8

      - name: Apply light silver theme
        shell: pwsh
        run: |
          $replacements = [ordered]@{
            '#071426'='#F4F1EA'; '#0B1D33'='#E7E3DA'; '#0E243E'='#FFFFFF'; '#1687FF'='#D6B04C';
            '#F5F9FF'='#111111'; '#8EA8C5'='#4A4A4A'; '#CFE3FA'='#111111'; '#123A64'='#DDD5C4';
            '#163553'='#D8D8D8'; '#081A2E'='#FFFFFF'; '#2A4F73'='#B8B3AA'; '#091B30'='#FFFFFF';
            '#E8F3FF'='#111111'; '#244A6B'='#B8B3AA'; '#0B2038'='#F6F4EF'; '#0D2642'='#EEEAE2';
            '#183B5D'='#D0CAC0'; '#08192C'='#EEEAE2'; '#17436D'='#C8C2B7'; '#35A9FF'='#111111';
            '#A8C5E4'='#333333'; '#3427A8'='#E1C46B'; '#07182A'='#F2EFE8'; '#0F65D8'='#D6B04C';
            '#20466A'='#C8C2B7'; '#0A1B30'='#F7F5F0'; '#1E4D78'='#C8C2B7'; '#9ACDFF'='#222222';
            '#0A1D34'='#F7F5F0'; '#1B3F62'='#D8D2C8'; '#2389FF'='#C89D32'; '#21A4FF'='#C89D32';
            '#34AEFF'='#C89D32'; '#3BABFF'='#C89D32'; '#75C6FF'='#555555'; '#78BFFF'='#555555';
            '#B9CCE0'='#444444'; '#A8B8CA'='#555555'; '#6F8CA8'='#666666'; '#D7EAFF'='#111111';
            '#BFE0FF'='#111111'; '#05111F'='#FFFFFF'; '#3529AD'='#E1C46B'; '#214568'='#C8C2B7';
            '#33E58B'='#2E8B57'; '#35D98B'='#2E8B57'; '#FF9CAC'='#8B1E2D'
          }
          Get-ChildItem src -Recurse -Filter *.xaml | ForEach-Object {
            $x = Get-Content $_.FullName -Raw
            foreach ($kv in $replacements.GetEnumerator()) { $x = $x.Replace($kv.Key, $kv.Value) }
            $x = $x.Replace('Foreground="White"', 'Foreground="#111111"')
            $x = $x.Replace('<Setter Property="Foreground" Value="White"/>', '<Setter Property="Foreground" Value="#111111"/>')
            $x = $x.Replace('<Setter Property="Foreground" Value="#E8F3FF"/>', '<Setter Property="Foreground" Value="#111111"/>')
            $x = $x.Replace('<Setter Property="Foreground" Value="#CFE3FA"/>', '<Setter Property="Foreground" Value="#111111"/>')
            $x = $x.Replace('<Setter Property="CaretBrush" Value="White"/>', '<Setter Property="CaretBrush" Value="#111111"/>')
            Set-Content $_.FullName $x -Encoding UTF8
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore src/LinuxBackupManager.csproj

      - name: Build
        shell: pwsh
        run: dotnet build src/LinuxBackupManager.csproj -c Release -r win-x64 --self-contained true --no-restore

      - name: Publish self-contained single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Dist | Out-Null
          dotnet publish src/LinuxBackupManager.csproj -c Release -r win-x64 --self-contained true --no-restore -o Dist /p:PublishSingleFile=true /p:PublishTrimmed=false /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true
          Copy-Item src/create-shortcut.ps1 Dist/create-shortcut.ps1
          Copy-Item src/Create-Desktop-Shortcut.cmd Dist/Create-Desktop-Shortcut.cmd
          Copy-Item src/README.md Dist/README.md
          $hash = Get-FileHash Dist/LinuxBackupManager.exe -Algorithm SHA256
          "LinuxBackupManager.exe  $($hash.Hash.ToLowerInvariant())" | Set-Content Dist/SHA256.txt
          Get-ChildItem Dist | Format-Table Name,Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: LinuxBackupManager-win-x64-v1.0.3-real-history
          path: Dist/*
          if-no-files-found: error
          compression-level: 9

      - name: Publish v1.0.3 EXE to repository
        shell: pwsh
        run: |
          $releaseDir = 'releases/windows/v1.0.3'
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Copy-Item 'Dist/LinuxBackupManager.exe' "$releaseDir/LinuxBackupManager-v1.0.3.exe" -Force
          Copy-Item 'Dist/SHA256.txt' "$releaseDir/SHA256.txt" -Force

          @"
          # LinuxBackupManager v1.0.3

          **Status:** Development Preview / Work in Progress

          This directory contains the Windows x64 self-contained .NET 10 executable.

          Files:
          - `LinuxBackupManager-v1.0.3.exe`
          - `SHA256.txt`

          The project is still under active development. Validate all backup, restore,
          migration and disaster-recovery workflows in a controlled environment before
          using them in production.

          Designed and Development by: antonios.mortos@outlook.com
          "@ | Set-Content "$releaseDir/README.md" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$releaseDir/LinuxBackupManager-v1.0.3.exe" "$releaseDir/SHA256.txt" "$releaseDir/README.md"
          git commit -m "Add LinuxBackupManager v1.0.3 Windows executable [skip ci]" || exit 0
          git push

      - name: Publish build status
        if: always()
        shell: pwsh
        run: |
          @"
          run_id=${{ github.run_id }}
          run_attempt=${{ github.run_attempt }}
          commit=${{ github.sha }}
          job_status=${{ job.status }}
          artifact=LinuxBackupManager-win-x64-v1.0.3-real-history
          "@ | Set-Content build-status.txt

          @"
          ## Windows build status
          - **Run:** ${{ github.run_id }} (attempt ${{ github.run_attempt }})
          - **Commit:** `${{ github.sha }}`
          - **Job status:** ${{ job.status }}
          - **Artifact:** `LinuxBackupManager-win-x64-v1.0.3-real-history`
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload build status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-status.txt
          if-no-files-found: error
          retention-days: 14
